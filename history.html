<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ইতিহাস - FF TopUp</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #28a745; /* সবুজ */
            --primary-color-rgb: 40, 167, 69; /* RGB for #28a745 for pulse effect */
            --secondary-color: #218838; /* গাঢ় সবুজ */
            --background-color: #f8f9fa; /* হালকা ধূসর ব্যাকগ্রাউন্ড */
            --card-bg-color: #ffffff; /* সাদা */
            --text-color: #212529; /* গাঢ় ধূসর */
            --subtle-text-color: #6c757d; /* ধূসর টেক্সট */
            --white-color: #ffffff;
            --danger-color: #dc3545; /* লাল */
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.08); /* হালকা শ্যাডো */
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popup-anim { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes pulse-help {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--primary-color-rgb), 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(var(--primary-color-rgb), 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(var(--primary-color-rgb), 0); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans Bengali', sans-serif; 
            background-color: var(--background-color); 
            color: var(--text-color); 
            padding-top: 75px; /* Adjusted top padding for fixed header */ 
            padding-bottom: 100px; 
        }
        
        /* Main Fixed Header Styles (Consistent) */
        .main-header {
            position: fixed; top: 15px; left: 50%; transform: translateX(-50%); 
            width: 95%; max-width: 420px; 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); 
            border-radius: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            z-index: 1000; 
            padding: 8px 15px; 
            display: flex; align-items: center; justify-content: space-between;
            height: 60px; 
        }
        .main-header .logo-container {
            display: flex; align-items: center;
            height: 44px; 
            min-width: auto; 
            justify-content: center;
            border-radius: 12px; 
            background-color: #f0fdf0; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.04); 
            padding: 0 10px; 
        }
        .main-header .logo-text { 
            font-family: 'Oswald', sans-serif; 
            font-size: 22px; 
            font-weight: 700;
            color: var(--primary-color); 
            white-space: nowrap;
            letter-spacing: 0.5px; 
            text-shadow: 1px 1px 1px rgba(var(--primary-color-rgb), 0.1); 
        }
        .main-header .menu-icon {
            font-size: 22px; 
            cursor: pointer;
            color: var(--primary-color);
            padding: 10px; 
            height: 44px; 
            width: 44px; 
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #f0fdf0; 
            box-shadow: 0 1px 4px rgba(0,0,0,0.04); 
        }
        .main-header .menu-icon:hover {
            background-color: rgba(0,0,0,0.1);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* Main content padding for order history */
        .main-content { 
            max-width: 420px;
            margin: 0 auto;
            padding: 0 15px; 
            padding-top: 25px; 
        }
        .card { 
            background: var(--card-bg-color); border-radius: 20px; 
            padding: 25px; margin-bottom: 25px; 
            box-shadow: var(--shadow); animation: fadeIn 0.5s ease-out forwards; 
        }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; color: var(--text-color); }
        
        /* Order List Specific Styles */
        .order-summary-card {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-bottom: 25px;
            padding: 15px 20px;
            background-color: var(--card-bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease-out forwards;
        }
        .summary-item {
            flex: 1;
        }
        .summary-item strong {
            display: block;
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .summary-item span {
            font-size: 14px;
            color: var(--subtle-text-color);
            font-weight: 500;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background-color: var(--card-bg-color);
            border-radius: 15px;
            padding: 15px 20px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease-out forwards;
            position: relative;
            overflow: hidden;
            border: 1px solid #eee;
        }
        .order-card h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-card h3 span {
            font-size: 14px;
            color: var(--subtle-text-color);
            font-weight: 500;
        }
        .order-detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-color);
        }
        .order-detail-item span:first-child {
            font-weight: 500;
            color: var(--subtle-text-color);
        }
        .order-detail-item span:last-child {
            font-weight: 600;
            text-align: right;
            flex-grow: 1;
            padding-left: 10px;
            word-break: break-all;
        }
        .order-detail-item.total-price span:last-child {
            color: var(--danger-color);
            font-size: 15px;
        }
        .order-status-badge {
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-pending { background-color: #fff3cd; color: #856404; } /* Yellow */
        .status-completed { background-color: #d4edda; color: #155724; } /* Green */
        .status-cancelled { background-color: #f8d7da; color: #721c24; } /* Red */
        .status-processing { background-color: #cce5ff; color: #004085; } /* Blue */

        .no-orders-message {
            text-align: center;
            color: var(--subtle-text-color);
            padding: 30px;
            font-size: 16px;
            background-color: var(--card-bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }
        .no-orders-message a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            margin-top: 10px;
            display: inline-block;
        }

        /* Floating Help Button (Consistent) */
        .help-button-wrapper {
            position: fixed;
            right: 20px; 
            bottom: 100px; /* Above the bottom navigation */
            z-index: 999;
        }
        .help-button {
            background: var(--primary-color);
            color: var(--white-color);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            animation: pulse-help 2s infinite; 
        }
        .help-button i {
            transition: transform 0.2s ease-in-out;
        }

        /* Bottom Navigation Bar (Consistent) */
        .bottom-nav { 
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); 
            width: 95%; max-width: 420px; 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); 
            display: flex; justify-content: space-around; align-items: center; 
            height: 60px; 
            border-radius: 30px; padding: 0 10px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.15); z-index: 1000; 
        }
        .nav-item-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; }
        .nav-item { 
            display: flex; flex-direction: column; align-items: center; 
            text-decoration: none; color: #aaa; transition: color 0.3s; 
            padding: 5px 0; 
        }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 11px; margin-top: 3px; } 
        .nav-item:hover, .nav-item.active { color: var(--primary-color); }

        /* Popup Menu Overlay (Consistent) */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); 
            z-index: 2000; display: none; align-items: center; justify-content: center; 
            opacity: 0; transition: opacity 0.3s ease; 
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { 
            background: var(--card-bg-color); border-radius: 20px; 
            width: 90%; max-width: 350px; padding: 25px; 
            position: relative; animation: popup-anim 0.3s ease; 
        }
        .close-popup, .close-modal { 
            position: absolute; top: 15px; right: 15px; 
            background: #f1f5f9; border: none; 
            width: 35px; height: 35px; border-radius: 50%; 
            font-size: 16px; color: var(--subtle-text-color); 
            cursor: pointer; display: flex; align-items: center; justify-content: center; 
            z-index: 10; transition: transform 0.2s; 
        }
        .close-popup:hover, .close-modal:hover { transform: scale(1.1); }
        
        .popup-profile { display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; margin-bottom: 15px; }
        .popup-profile img { width: 60px; height: 60px; border-radius: 50%; }
        .popup-profile-details .name { font-size: 20px; font-weight: 700; }
        .popup-profile-details .edit-profile { font-size: 14px; color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .popup-profile-details .edit-profile i { margin-right: 5px; }
        .popup-nav-list a { display: flex; align-items: center; text-decoration: none; color: var(--text-color); padding: 15px; border-radius: 12px; transition: background-color 0.2s; }
        .popup-nav-list a:hover { background-color: #f0f2f5; }
        .popup-nav-list i { font-size: 20px; color: var(--primary-color); width: 40px; }
        .popup-nav-list span { font-size: 16px; font-weight: 500; }
        .popup-nav-list a.logout { color: var(--danger-color); }
        .popup-nav-list a.logout i { color: var(--danger-color); }


        /* Footer Styles (Consistent) */
        .app-footer {
            text-align: center;
            padding: 25px 15px;
            margin-top: 30px;
            background-color: var(--card-bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
            color: var(--subtle-text-color);
            font-size: 14px;
        }
        .app-footer h4 {
            font-size: 16px;
            color: var(--text-color);
            margin-bottom: 15px;
        }
        .app-footer .footer-links a {
            color: var(--primary-color);
            text-decoration: none;
            margin: 0 8px;
            font-weight: 500;
            transition: color 0.2s;
        }
        .app-footer .footer-links a:hover {
            color: var(--secondary-color);
        }
        .app-footer p {
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Main Fixed Header -->
    <header class="main-header">
        <div class="logo-container">
            <span class="logo-text">FF TopUp</span>
        </div>
        <div class="auth-area" id="headerAuthArea">
            <!-- Content changes based on login state (JS handles this) -->
        </div>
    </header>

    <main class="main-content">
        <h2 class="section-title">আমার অর্ডারের ইতিহাস</h2>

        <!-- Order Summary Card -->
        <div class="order-summary-card">
            <div class="summary-item">
                <strong id="totalOrdersCount">0</strong>
                <span>মোট অর্ডার</span>
            </div>
            <div class="summary-item">
                <strong id="completedOrdersCount">0</strong>
                <span>সম্পূর্ণ</span>
            </div>
        </div>

        <!-- Order List -->
        <div class="order-list" id="orderList">
            <!-- Orders will be dynamically loaded here -->
            <p class="no-orders-message" id="noOrdersMessage" style="display: none;">
                আপনার কোনো অর্ডার ইতিহাস পাওয়া যায়নি।
                <a href="index.html">এখনই টপ-আপ করুন!</a>
            </p>
            <p style="text-align: center; color: var(--subtle-text-color);" id="loadingMessage">অর্ডার লোড হচ্ছে...</p>
        </div>
    </main>

    <!-- Floating Help Button -->
    <div class="help-button-wrapper">
        <button id="helpCenterBtn" class="help-button">
            <i class="fas fa-headset"></i>
        </button>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item-wrapper"><a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>হোম</span></a></div>
        <div class="nav-item-wrapper"><a href="offers.html" class="nav-item"><i class="fas fa-tags"></i><span>অফার</span></a></div>
        <div class="nav-item-wrapper"><a href="tutorial.html" class="nav-item"><i class="fas fa-book"></i><span>টিউটোরিয়াল</span></a></div>
        <div class="nav-item-wrapper"><a href="history.html" class="nav-item active"><i class="fas fa-history"></i><span>অর্ডার</span></a></div>
        <div class="nav-item-wrapper"><a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>প্রোফাইল</span></a></div>
    </div>

    <!-- Popup Menu Overlay (for general settings/menu triggered by header menu icon) -->
    <div class="modal-overlay" id="popupMenuOverlay">
        <div class="modal-content">
            <button class="close-popup" id="closePopupBtn"><i class="fas fa-times"></i></button>
            <div class="popup-profile">
                <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=N" alt="Profile" id="popupProfileAvatar">
                <div class="popup-profile-details">
                    <p class="name" id="popupDisplayName">নাহিদ</p>
                    <a href="profile.html" class="edit-profile"> <i class="fas fa-pencil-alt"></i> প্রোফাইল এডিট</a>
                </div>
            </div>
            <nav class="popup-nav-list">
                <a href="wallet.html"><i class="fas fa-wallet"></i> <span>আমার ওয়ালেট</span></a>
                <a href="history.html"><i class="fas fa-history"></i> <span>লেনদেনের ইতিহাস</span></a>
                <a href="refer.html"><i class="fas fa-users"></i> <span>রেফার করুন</span></a>
                <a href="#" class="logout" id="logoutLink"><i class="fas fa-sign-out-alt"></i> <span>লগআউট</span></a>
            </nav>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script> <!-- For Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script> <!-- For Realtime Database -->

    <script type="module">
        // Your web app's Firebase configuration
        const firebaseConfig = {
  apiKey: "AIzaSyB2005LXbWHrZd-EkBSE93MKampL4pvDBg",
  authDomain: "ff-topup-1c7b4.firebaseapp.com",
  databaseURL: "https://ff-topup-1c7b4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ff-topup-1c7b4",
  storageBucket: "ff-topup-1c7b4.firebasestorage.app",
  messagingSenderId: "319376678545",
  appId: "1:319376678545:web:18b4e552f0eaf73970e930",
  measurementId: "G-TEJL6H10X4"
};

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const analytics = firebase.analytics(app);
        const auth = firebase.auth(app); // Get Auth instance
        const database = firebase.database(app); // Get Realtime Database instance

        // --- UI Elements ---
        const headerAuthArea = document.getElementById('headerAuthArea');
        const popupProfileAvatar = document.getElementById('popupProfileAvatar');
        const popupDisplayName = document.getElementById('popupDisplayName');
        const logoutLink = document.getElementById('logoutLink');
        
        // Order history specific elements
        const totalOrdersCount = document.getElementById('totalOrdersCount');
        const completedOrdersCount = document.getElementById('completedOrdersCount');
        const orderList = document.getElementById('orderList');
        const noOrdersMessage = document.getElementById('noOrdersMessage');
        const loadingMessage = document.getElementById('loadingMessage');

        // --- Utility Functions ---
        function formatTimestamp(timestamp) {
            const date = new Date(timestamp);
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return date.toLocaleDateString('bn-BD', options);
        }

        function getStatusClass(status) {
            switch (status.toLowerCase()) {
                case 'pending': return 'status-pending';
                case 'completed': return 'status-completed';
                case 'cancelled': return 'status-cancelled';
                case 'processing': return 'status-processing';
                default: return '';
            }
        }

        // --- Fetch & Display Orders ---
        async function loadOrders(user) {
            loadingMessage.style.display = 'block';
            orderList.innerHTML = ''; // Clear previous orders
            noOrdersMessage.style.display = 'none';

            let total = 0;
            let completed = 0;

            if (!user) {
                // Should be redirected by auth.onAuthStateChanged, but as a fallback
                loadingMessage.textContent = 'লগইন করুন আপনার অর্ডার দেখতে।';
                return;
            }

            try {
                // Fetch orders for the current user, ordered by timestamp descending
                const ordersRef = database.ref('orders').orderByChild('uid').equalTo(user.uid);
                const snapshot = await ordersRef.once('value');

                if (snapshot.exists()) {
                    const ordersData = snapshot.val();
                    const ordersArray = [];
                    for (let key in ordersData) {
                        ordersArray.push({ id: key, ...ordersData[key] });
                    }

                    // Sort by timestamp in descending order (latest first)
                    ordersArray.sort((a, b) => b.timestamp - a.timestamp);

                    ordersArray.forEach(order => {
                        total++;
                        if (order.status && order.status.toLowerCase() === 'completed') {
                            completed++;
                        }

                        const orderCard = document.createElement('div');
                        orderCard.classList.add('order-card');
                        orderCard.innerHTML = `
                            <h3>
                                অর্ডার আইডি: <span style="color: var(--text-color);">${order.id.substring(0, 8)}...</span>
                                <span class="order-status-badge ${getStatusClass(order.status || 'pending')}">
                                    ${order.status || 'pending'}
                                </span>
                            </h3>
                            <div class="order-detail-item">
                                <span>Player ID:</span>
                                <span>${order.playerId || 'N/A'}</span>
                            </div>
                            <div class="order-detail-item">
                                <span>ডায়মন্ড:</span>
                                <span>${order.diamonds || 'N/A'}</span>
                            </div>
                            <div class="order-detail-item total-price">
                                <span>মোট মূল্য:</span>
                                <span>৳ ${order.price ? order.price.toFixed(2) : '0.00'}</span>
                            </div>
                            <div class="order-detail-item">
                                <span>তারিখ ও সময়:</span>
                                <span>${formatTimestamp(order.timestamp)}</span>
                            </div>
                        `;
                        orderList.appendChild(orderCard);
                    });
                } else {
                    noOrdersMessage.style.display = 'block';
                }
            } catch (error) {
                console.error("Error fetching orders:", error);
                loadingMessage.textContent = 'অর্ডার লোড করতে সমস্যা হয়েছে।';
                noOrdersMessage.style.display = 'block'; // Show "no orders" with error text
                noOrdersMessage.querySelector('a').style.display = 'none'; // Hide top-up link on error
            } finally {
                loadingMessage.style.display = 'none';
                totalOrdersCount.textContent = total;
                completedOrdersCount.textContent = completed;
            }
        }

        // --- Authentication & UI Updates for Header/Popup ---
        async function updateUI(user) {
            headerAuthArea.innerHTML = ''; 

            if (user) {
                let displayNameForHeader = user.displayName || "ব্যবহারকারী";
                const MAX_NAME_LENGTH = 6; 

                try {
                    const userSnapshot = await database.ref('users/' + user.uid).once('value');
                    const userData = userSnapshot.val();
                    
                    let fullUserName = user.displayName || 'ব্যবহারকারী';
                    if (userData && userData.fullName) {
                        fullUserName = userData.fullName;
                        if (fullUserName.length > MAX_NAME_LENGTH) {
                            displayNameForHeader = fullUserName.substring(0, MAX_NAME_LENGTH - 1) + '...';
                        } else {
                            displayNameForHeader = fullUserName;
                        }
                    } else {
                         if (displayNameForHeader.length > MAX_NAME_LENGTH) {
                            displayNameForHeader = displayNameForHeader.substring(0, MAX_NAME_LENGTH - 1) + '...';
                        }
                    }
                    
                    const userAvatar = (userData && userData.photoURL) || user.photoURL || `https://api.dicebear.com/7.x/pixel-art/svg?seed=${fullUserName}`;
                    
                    headerAuthArea.innerHTML = `<div class="menu-icon" id="headerMenuIcon"><i class="fas fa-bars"></i></div>`;
                    document.getElementById('headerMenuIcon').addEventListener('click', () => {
                        document.getElementById('popupMenuOverlay').classList.add('active');
                    });

                    popupProfileAvatar.src = userAvatar;
                    popupDisplayName.textContent = fullUserName;
                    logoutLink.style.display = 'flex';

                    // Load orders specifically for this user
                    loadOrders(user);

                } catch (error) {
                    console.error("Error fetching user data:", error);
                    // Fallback UI
                    headerAuthArea.innerHTML = `<div class="menu-icon" id="headerMenuIcon"><i class="fas fa-bars"></i></div>`;
                     document.getElementById('headerMenuIcon').addEventListener('click', () => {
                        document.getElementById('popupMenuOverlay').classList.add('active');
                    });
                    popupProfileAvatar.src = `https://api.dicebear.com/7.x/pixel-art/svg?seed=Guest`;
                    popupDisplayName.textContent = 'অতিথি';
                    logoutLink.style.display = 'none';
                    loadingMessage.textContent = 'প্রোফাইল তথ্য লোড করতে সমস্যা হয়েছে।';
                }

            } else {
                // User is signed out. Redirect to login page.
                window.location.href = "auth.html";
            }
        }

        // Listen for auth state changes
        auth.onAuthStateChanged(updateUI);

        document.addEventListener('DOMContentLoaded', () => {
            // --- General Modal Toggling Logic ---
            const setupModalToggle = (openTriggerSelector, targetElementId, closeTriggerSelector) => {
                const targetElement = document.getElementById(targetElementId);
                if (!targetElement) return;

                if (openTriggerSelector) {
                    document.querySelectorAll(openTriggerSelector).forEach(button => {
                        button.addEventListener('click', (e) => {
                            e.preventDefault();
                            targetElement.classList.add('active');
                        });
                    });
                }
                
                if (closeTriggerSelector) {
                    const closeButton = targetElement.querySelector(closeTriggerSelector);
                    if (closeButton) {
                        closeButton.addEventListener('click', () => {
                            targetElement.classList.remove('active');
                        });
                    }
                }

                targetElement.addEventListener('click', (e) => {
                    if (e.target === targetElement) {
                        targetElement.classList.remove('active');
                    }
                });
            };

            // Setup modals
            setupModalToggle(null, 'popupMenuOverlay', '#closePopupBtn'); // Triggered by headerMenuIcon

            // Floating Help Button link
            document.getElementById('helpCenterBtn').addEventListener('click', (e) => {
                e.preventDefault();
                window.location.href = 'help_center.html';
            });


            // --- Logout Functionality (from popup menu) ---
            const handleLogout = async (e) => {
                e.preventDefault();
                try {
                    await auth.signOut();
                    alert('আপনি সফলভাবে লগআউট করেছেন!');
                    document.getElementById('popupMenuOverlay').classList.remove('active'); 
                    // updateUI will be called by onAuthStateChanged listener and redirect
                } catch (error) {
                    console.error('Error signing out:', error);
                    alert('লগআউট করতে সমস্যা হয়েছে।');
                }
            };
            logoutLink.addEventListener('click', handleLogout); 


            // --- Navigation Button Actions ---
            // Bottom Nav links 
            document.querySelector('.bottom-nav .nav-item-wrapper:nth-child(1) a').href = 'index.html'; // Home
            document.querySelector('.bottom-nav .nav-item-wrapper:nth-child(2) a').href = 'offers.html'; // Offer
            document.querySelector('.bottom-nav .nav-item-wrapper:nth-child(3) a').href = 'tutorial.html'; // Tutorial
            document.querySelector('.bottom-nav .nav-item-wrapper:nth-child(4) a').href = 'history.html'; // Order (This page)
            document.querySelector('.bottom-nav .nav-item-wrapper:nth-child(5) a').href = 'profile.html'; // Profile

        });
    </script>
</body>
</html>
