<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> - FF TopUp</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #28a745; --primary-color-rgb: 40, 167, 69;
            --secondary-color: #218838; --background-color: #f8f9fa;
            --card-bg-color: #ffffff; --text-color: #212529;
            --subtle-text-color: #6c757d; --white-color: #ffffff;
            --danger-color: #dc3545; --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans Bengali', sans-serif; background-color: var(--background-color); color: var(--text-color); }
        .main-header { padding: 15px 25px; text-align: center; }
        .logo-text { font-family: 'Oswald', sans-serif; font-size: 28px; font-weight: 700; color: var(--primary-color); text-decoration: none; }
        
        /* Authentication Form Styles */
        .auth-container {
            max-width: 420px;
            margin: 30px auto;
            padding: 30px;
            background-color: var(--card-bg-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
            animation: fadeIn 0.5s ease-out forwards;
        }
        .auth-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #e0e0e0;
        }
        .auth-tabs button {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            color: var(--subtle-text-color);
            transition: color 0.3s, border-bottom-color 0.3s;
            border-bottom: 3px solid transparent;
        }
        .auth-tabs button.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .auth-form-group { margin-bottom: 18px; }
        .auth-form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-color); }
        .auth-form-group input {
            width: 100%; padding: 12px 15px; border: 1px solid #ddd;
            border-radius: 10px; font-size: 16px; font-family: 'Noto Sans Bengali', sans-serif;
            background-color: #f8faff; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-form-group input:focus { outline: none; border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(var(--primary-color-rgb), 0.25); }
        
        .auth-btn {
            width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 16px;
            font-weight: 700; cursor: pointer; transition: transform 0.2s, background-color 0.2s; margin-top: 10px;
            background-color: var(--primary-color); color: var(--white-color);
        }
        .auth-btn:hover { transform: translateY(-2px); background-color: var(--secondary-color); }

        .google-btn {
            display: flex; align-items: center; justify-content: center;
            width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd;
            font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            background-color: #fff; color: #444; gap: 10px;
        }
        .google-btn:hover { background-color: #f5f5f5; border-color: #ccc; }
        .google-btn img { width: 22px; height: 22px; }

        .divider { text-align: center; margin: 25px 0; color: var(--subtle-text-color); font-weight: 500; }
        .forgot-password-link { text-align: right; margin-top: 10px; }
        .forgot-password-link a { color: var(--primary-color); text-decoration: none; font-size: 14px; font-weight: 500; }
        
        #register-form, #forgot-password-form { display: none; }
        #message { text-align: center; margin-top: 15px; font-weight: 500; padding: 10px; border-radius: 8px; }
        .message-success { color: #155724; background-color: #d4edda; }
        .message-error { color: #721c24; background-color: #f8d7da; }
    </style>
</head>
<body>
    <header class="main-header">
        <a href="index.html" class="logo-text">FF TopUp</a>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-tabs">
                <button id="login-tab" class="active" onclick="showForm('login')">লগইন</button>
                <button id="register-tab" onclick="showForm('register')">রেজিস্টার</button>
            </div>

            <form id="login-form">
                <div class="auth-form-group">
                    <label for="login-email">ইমেইল</label>
                    <input type="email" id="login-email" placeholder="আপনার ইমেইল দিন" required>
                </div>
                <div class="auth-form-group">
                    <label for="login-password">পাসওয়ার্ড</label>
                    <input type="password" id="login-password" placeholder="আপনার পাসওয়ার্ড দিন" required>
                </div>
                <div class="forgot-password-link">
                    <a href="#" onclick="showForm('forgot-password')">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>
                <button type="submit" class="auth-btn">লগইন করুন</button>
            </form>

            <form id="register-form">
                <div class="auth-form-group">
                    <label for="register-name">সম্পূর্ণ নাম</label>
                    <input type="text" id="register-name" placeholder="আপনার পুরো নাম দিন" required>
                </div>
                <div class="auth-form-group">
                    <label for="register-email">ইমেইল</label>
                    <input type="email" id="register-email" placeholder="আপনার ইমেইল দিন" required>
                </div>
                <div class="auth-form-group">
                    <label for="register-password">পাসওয়ার্ড</label>
                    <input type="password" id="register-password" placeholder="একটি নতুন পাসওয়ার্ড দিন" required>
                </div>
                <button type="submit" class="auth-btn">রেজিস্টার করুন</button>
            </form>
            
            <form id="forgot-password-form">
                <p style="text-align:center; margin-bottom: 20px;">আপনার ইমেইল দিন, আমরা পাসওয়ার্ড রিসেট করার জন্য একটি লিঙ্ক পাঠাব।</p>
                <div class="auth-form-group">
                    <label for="reset-email">ইমেইল</label>
                    <input type="email" id="reset-email" placeholder="আপনার রেজিস্টার্ড ইমেইল" required>
                </div>
                <button type="submit" class="auth-btn">রিসেট লিঙ্ক পাঠান</button>
            </form>

            <div class="divider">অথবা</div>

            <button class="google-btn" id="google-signin-btn">
                <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
                <span>Google দিয়ে লগইন করুন</span>
            </button>
            
            <div id="message" style="display: none;"></div>
        </div>
    </main>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script>
        // আপনার Firebase কনফিগারেশন এখানে পেস্ট করুন
        const firebaseConfig = {
  apiKey: "AIzaSyB2005LXbWHrZd-EkBSE93MKampL4pvDBg",
  authDomain: "ff-topup-1c7b4.firebaseapp.com",
  databaseURL: "https://ff-topup-1c7b4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ff-topup-1c7b4",
  storageBucket: "ff-topup-1c7b4.firebasestorage.app",
  messagingSenderId: "319376678545",
  appId: "1:319376678545:web:18b4e552f0eaf73970e930",
  measurementId: "G-TEJL6H10X4"
};

        // Firebase Initialize
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // UI Elements
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const forgotPasswordForm = document.getElementById('forgot-password-form');
        const googleSignInBtn = document.getElementById('google-signin-btn');
        const messageDiv = document.getElementById('message');

        // Form Switching Logic
        function showForm(formName) {
            loginForm.style.display = 'none';
            registerForm.style.display = 'none';
            forgotPasswordForm.style.display = 'none';
            document.getElementById('login-tab').classList.remove('active');
            document.getElementById('register-tab').classList.remove('active');

            if (formName === 'login') {
                loginForm.style.display = 'block';
                document.getElementById('login-tab').classList.add('active');
            } else if (formName === 'register') {
                registerForm.style.display = 'block';
                document.getElementById('register-tab').classList.add('active');
            } else if (formName === 'forgot-password') {
                forgotPasswordForm.style.display = 'block';
            }
        }
        showForm('login'); // Show login form by default

        // Display Message Function
        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = type === 'success' ? 'message-success' : 'message-error';
            messageDiv.style.display = 'block';
            setTimeout(() => { messageDiv.style.display = 'none'; }, 5000);
        }

        // --- Event Listeners ---
        
        // 1. Registration
        registerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    
                    // Generate unique codes
                    const userCode = Math.floor(100000 + Math.random() * 900000); // 6-digit user code
                    const referralCode = 'FF' + Math.random().toString(36).substring(2, 8).toUpperCase(); // Alphanumeric referral code

                    // Save user data to Realtime Database
                    database.ref('users/' + user.uid).set({
                        fullName: name,
                        email: email,
                        userCode: userCode,
                        referralCode: referralCode,
                        balance: 0,
                        createdAt: firebase.database.ServerValue.TIMESTAMP
                    }).then(() => {
                        // Update user profile
                        return user.updateProfile({ displayName: name });
                    }).then(() => {
                        showMessage('রেজিস্ট্রেশন সফল হয়েছে! আপনাকে হোমপেজে নিয়ে যাওয়া হচ্ছে...', 'success');
                        setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                    });
                })
                .catch((error) => {
                    console.error("Registration Error:", error);
                    let message = 'একটি সমস্যা হয়েছে। আবার চেষ্টা করুন।';
                    if (error.code === 'auth/email-already-in-use') {
                        message = 'এই ইমেইলটি bereits registriert.';
                    } else if (error.code === 'auth/weak-password') {
                        message = 'পাসওয়ার্ডটি খুব দুর্বল। কমপক্ষে ৬ অক্ষর ব্যবহার করুন।';
                    }
                    showMessage(message, 'error');
                });
        });

        // 2. Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    showMessage('লগইন সফল হয়েছে!', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                })
                .catch((error) => {
                    console.error("Login Error:", error);
                    showMessage('ইমেইল বা পাসওয়ার্ড সঠিক নয়।', 'error');
                });
        });
        
        // 3. Google Sign-In
        googleSignInBtn.addEventListener('click', () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    const isNewUser = result.additionalUserInfo.isNewUser;
                    
                    if (isNewUser) {
                        // If it's a new user, save their data to the database
                        const userCode = Math.floor(100000 + Math.random() * 900000);
                        const referralCode = 'FF' + Math.random().toString(36).substring(2, 8).toUpperCase();
                        
                        database.ref('users/' + user.uid).set({
                            fullName: user.displayName,
                            email: user.email,
                            userCode: userCode,
                            referralCode: referralCode,
                            balance: 0,
                            createdAt: firebase.database.ServerValue.TIMESTAMP
                        });
                    }
                    
                    showMessage('Google দিয়ে লগইন সফল হয়েছে!', 'success');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                })
                .catch((error) => {
                    console.error("Google Sign-In Error:", error);
                    showMessage('Google দিয়ে সাইন ইন করতে সমস্যা হয়েছে।', 'error');
                });
        });

        // 4. Forgot Password
        forgotPasswordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    showMessage('পাসওয়ার্ড রিসেট লিঙ্ক আপনার ইমেইলে পাঠানো হয়েছে।', 'success');
                    setTimeout(() => { showForm('login'); }, 3000);
                })
                .catch((error) => {
                    console.error("Password Reset Error:", error);
                    showMessage('ইমেইলটি রেজিস্টার্ড নয় অথবা কোনো সমস্যা হয়েছে।', 'error');
                });
        });
    </script>
</body>
</html>
